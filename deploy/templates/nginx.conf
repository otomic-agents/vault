events {
   worker_connections 1024;
}

http {
   include       mime.types;
   default_type  application/octet-stream;

   sendfile        on;
   keepalive_timeout  65;

   server {
        listen 19000;
        set_real_ip_from 127.0.0.1/32;
        set_real_ip_from 172.18.0.0/16;
        set_real_ip_from 172.19.0.0/16;
        real_ip_header X-Real-IP;
        real_ip_recursive on;

        location = / {
            return 404;
        }

        # Forward to evm_sign service (for LP)
        location /lp/9006/ {
            proxy_pass http://evm_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Forward to evm_sign service (for LP)
        location /lp/60/ {
            proxy_pass http://evm_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Forward to evm_sign service (for LP)
        location /lp/614/ {
            proxy_pass http://evm_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Forward to solana_sign service (for LP)
        location /lp/501/ {
            proxy_pass http://solana_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Forward to evm_sign service (for Relay)
        location /relay/9006/ {
            proxy_pass http://evm_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /relay/60/ {
            proxy_pass http://evm_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /relay/614/ {
            proxy_pass http://evm_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Forward to solana_sign service (for Relay)
        location /relay/501/ {
            proxy_pass http://solana_sign:9100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


   }
}